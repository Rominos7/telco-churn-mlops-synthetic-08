services:
  # ── Сервіс для генерації даних
  generator:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: python src/generate_dataset_ext.py --samples 50000 --conv-samples 7500
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ── FastAPI prediction service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-api          # ← ДОДАНО: фіксоване ім'я для DNS резолюції
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mlflow
    environment:
      # - MLFLOW_HTTP_REQUEST_ALLOW_LIST={"/metrics": ["GET"]}
      # Або спробуйте дозволити всі хости для розробки:
      - MLFLOW_SERVER_GUNICORN_OPTS=--forwarded-allow-ips="*"
      - MODEL_PATH=/app/models/churn_model.pkl
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3  # Остання перевірена версія
    container_name: mlflow
    hostname: mlflow.int
    ports:
        - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*    
    volumes:
      - ./mlartifacts:/mlartifacts
      - ./mlflow_db:/mlflow_db
    #vuser: root
    entrypoint: >
        /bin/sh -c "
        pip install prometheus-flask-exporter &&
        mlflow server 
        --backend-store-uri sqlite:///mlflow_db/mlflow.db 
        --default-artifact-root /mlartifacts 
        --host 0.0.0.0 
        --port 5000 
        --expose-prometheus /metrics"
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 5


# ── Явна мережа — не залежить від назви папки
# Створюється тут (base file); docker-compose.monitoring.yml підключається
# до неї через networks.mlops-net.external: true
networks:
  mlops-net:
    driver: bridge
    name: mlops-net
